name: Laptop Bot Dinleyici

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# SSD taramasından tamamen ayrı bir grup - biri diğerini beklemez/etkilemez.
concurrency:
  group: laptop-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Yeni mesaj var mı kontrol et, varsa ara ve cevapla
        env:
          LAPTOP_TELEGRAM_BOT_TOKEN: ${{ secrets.LAPTOP_TELEGRAM_BOT_TOKEN }}
          LAPTOP_TELEGRAM_FRIEND_CHAT_ID: ${{ secrets.LAPTOP_TELEGRAM_FRIEND_CHAT_ID }}
        run: python laptop-arama/telegram_bot.py

      - name: Mesaj takip noktasını (offset) repoya geri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add laptop-arama/last_update_id.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Laptop bot: mesaj takip noktası güncellendi"
          git push
