name: SSD Fiyat Kontrolü

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Bir çalıştırma 10 dakikadan uzun sürerse, aynı anda ikinci bir çalıştırma
# başlayıp aynı veritabanına yazmaya çalışmasın diye tek grupta sıraya koyuyoruz.
concurrency:
  group: price-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fiyatları kontrol et ve gerekirse bildirim gönder
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python core/check_and_notify.py

      - name: Fiyat geçmişini repoya geri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_history.db
          git diff --cached --quiet || git commit -m "Fiyat güncellemesi $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
